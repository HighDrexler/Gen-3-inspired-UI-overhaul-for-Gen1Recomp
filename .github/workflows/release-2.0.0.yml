name: Publish Gen 3 UI 2.0.0

on:
  push:
    paths:
      - '.release_payload_final/GO'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild and verify 2.0.0
        shell: bash
        run: |
          set -euo pipefail
          cat .release_payload_final/part-* > /tmp/release.b64
          base64 --decode /tmp/release.b64 > /tmp/gen3_battle_ui-2.0.0.zip
          unzip -t /tmp/gen3_battle_ui-2.0.0.zip
          rm -rf /tmp/release && mkdir -p /tmp/release
          unzip -q /tmp/gen3_battle_ui-2.0.0.zip -d /tmp/release
          test -f /tmp/release/gen3_battle_ui/main.lua
          test -f /tmp/release/gen3_battle_ui/manifest.json
          grep -q '"version": "2.0.0"' /tmp/release/gen3_battle_ui/manifest.json

      - name: Update launcher-ready repository root
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/release/gen3_battle_ui/main.lua ./main.lua
          cp /tmp/release/gen3_battle_ui/manifest.json ./manifest.json
          cp /tmp/release/gen3_battle_ui/README.md ./README.md
          cp /tmp/release/gen3_battle_ui/CHANGELOG.md ./CHANGELOG.md
          find . -maxdepth 1 -type f -name '*.zip' -delete
          rm -rf .release_payload .release_payload2 .release_payload_final
          rm -f .github/workflows/release-2.0.0.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name 'HighDrexler Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Release Gen 3 Inspired UI Overhaul 2.0.0'
          git push origin HEAD:main

      - name: Publish v2.0.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v2.0.0 /tmp/gen3_battle_ui-2.0.0.zip --repo '${{ github.repository }}' --target main --title 'Gen 3 Inspired UI Overhaul v2.0.0' --notes 'Gen 3 Inspired UI Overhaul 2.0.0 release with Gen I + Gen II UI overhaul, compatibility-focused sprite handling, item-flow fixes, and final release cleanup.'
